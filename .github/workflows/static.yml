name: Deploy seating plan workbook to Pages
# Publishes an independent guide associated with https://seating-chart-maker.org/
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p generated_site
          printf '%s' '' | base64 --decode > generated_site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
